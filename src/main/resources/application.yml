spring:
  application:
    name: Project
  datasource:
    url: "jdbc:mysql://localhost:3306/ai_learn?createDatabaseIfNotExist=true"
    username: root
    password: "${DB_PASSWORD}"
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
  jwt:
    secret: "${JWT_SECRET:change-this-local-jwt-secret-key-at-least-32-bytes}"
