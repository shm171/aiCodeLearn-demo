spring:
  application:
    name: Project
  datasource:
    url: "jdbc:mysql://localhost:3306/ai_learn?createDatabaseIfNotExist=true"
    username: root
    password: "${MYSQL_ROOT_DB_PASSWORD:123456}"
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 256KB
      max-request-size: 512KB
  jpa:
    hibernate:
      ddl-auto: validate
  jwt:
    secret: "${JWT_SECRET:change-this-local-jwt-secret-key-at-least-32-bytes}"
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
            platform: mariadb
    openai:
      apikey: "${DEEPSEEK_APIKEY}"
